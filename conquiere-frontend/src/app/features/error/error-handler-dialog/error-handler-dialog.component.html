<h1 mat-dialog-title><i class="fa fa-exclamation-triangle" aria-hidden="true"></i> {{ title }}</h1>
<mat-dialog-content>
    <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button id="error-btn" mat-raised-button mat-dialog-close>Okay</button>
</mat-dialog-actions>
