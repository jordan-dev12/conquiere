<section class="vh-100" style="background-color: #eee;">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px;">
            <div class="card-body p-md-5">
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
  
                  <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Créer un compte</p>
  
                  <form class="mx-1 mx-md-4" #registrationForm ="ngForm" (ngSubmit)="registration(registrationForm)" required  >
  
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="text" [(ngModel)]="userData().name"  placeholder="" name="name" class="form-control" required />
                        <label class="form-label" for="name">Nom*</label>
                      </div>
                    </div>
  
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="text" placeholder="" [(ngModel)]="userData().surname" name="surname" class="form-control" required />
                        <label class="form-label" for="surname">Prénom*</label>
                      </div>
                    </div>
  
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fa fa-calendar fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="date" id="date" placeholder="" [(ngModel)]="userData().birthdate" name ="birthdate" required maxlength="8" appDateFormat class="form-control" />
                        <label class="form-label" for="date">Date naissance*</label>
                      </div>
                    </div>
  
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="email" placeholder="" [ngModel]="userData().email" (ngModelChange)="updateEmail($event)" name="email" class="form-control" required />
                        <label class="form-label" for="email">Email*</label>
                      </div>
                    </div>
  
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="password" placeholder="" id="password"  [ngModel]="userData().password" (ngModelChange)="updatePassword($event)" name="password" class="form-control" required />
                        <label class="form-label" for="password">Mot de passe*</label>
                      </div>
                    </div>
  
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                      <div data-mdb-input-init class="form-outline flex-fill mb-0">
                        <input type="password" placeholder="" id="confirm-password" name="confirm-password"  class="form-control" required />
                        <label class="form-label" for="confirm-password">Confirmer le mot de passe</label>
                      </div>
                    </div>
  
                    <div class="form-check d-flex justify-content-center mb-5">
                      <input class="form-check-input me-2" type="checkbox" name="terms" value="" id="terms" required />
                      <label class="form-check-label" for="terms">
                        J'accepte les conditions d'utilisation et la <a href="#!">politique de confidentialité</a>
                      </label>
                    </div>
  
                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                      <button  type="submit" data-mdb-button-init data-mdb-ripple-init [disabled]="isFormValid"  class="btn btn-primary btn-lg">S'inscrire</button>
                    </div>
  
                  </form>

                  <p class="info-text">Vous avez déjà un compte ? <a [routerLink] = "AUTH.login" >Connectez-vous ici</a></p>
                  <p class="info-text">Les champs marqués d'un <span style="color: red;">*</span> sont obligatoires.</p>
          
                  <div>Form valid: {{ isFormValid() }}</div>
  
                </div>
                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
  
                  <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                    class="img-fluid" alt="Sample image">
  
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
